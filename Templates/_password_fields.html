{# Password + confirm with a live checklist. Server enforces the same rules (security.py). #}
<div class="f-group">
  <label class="f-label en" for="password">Password *</label>
  <label class="f-label ur" for="password">پاس ورڈ *</label>
  <div class="pw-wrap">
    <input class="f-input" type="password" id="password" name="password" autocomplete="new-password"
           minlength="8" maxlength="64" placeholder="Create a strong password" required>
    <button type="button" class="pw-toggle" aria-label="Show password">👁</button>
  </div>
  <ul class="pw-rules" id="pwRules">
    <li data-rule="len">8–64 characters</li>
    <li data-rule="upper">An uppercase letter (A-Z)</li>
    <li data-rule="lower">A lowercase letter (a-z)</li>
    <li data-rule="digit">A number (0-9)</li>
    <li data-rule="special">A special character (! @ # $ % …)</li>
    <li data-rule="personal">Does not contain your name, CNIC or email</li>
  </ul>
</div>
<div class="f-group">
  <label class="f-label en" for="confirm_password">Confirm Password *</label>
  <label class="f-label ur" for="confirm_password">پاس ورڈ کی تصدیق *</label>
  <input class="f-input" type="password" id="confirm_password" name="confirm_password"
         autocomplete="new-password" maxlength="64" placeholder="Re-enter your password" required>
  <span class="pw-match" id="pwMatch"></span>
</div>
<script>
(function () {
  var pw = document.getElementById('password'), cf = document.getElementById('confirm_password');
  var rules = document.getElementById('pwRules'), match = document.getElementById('pwMatch');
  var form = pw.form;
  function val(n) { var i = form.elements[n]; return i ? (i.value || '').toLowerCase() : ''; }
  function check() {
    var p = pw.value, low = p.toLowerCase();
    var personal = true;
    val('name').split(/\s+/).forEach(function (w) { if (w.length >= 3 && low.indexOf(w) >= 0) personal = false; });
    var cnic = val('cnic').replace(/\D/g, '');
    if (cnic.length === 13 && p.replace(/\D/g, '').indexOf(cnic) >= 0) personal = false;
    var local = val('email').split('@')[0];
    if (local.length >= 3 && low.indexOf(local) >= 0) personal = false;
    var ok = {
      len: p.length >= 8 && p.length <= 64, upper: /[A-Z]/.test(p), lower: /[a-z]/.test(p),
      digit: /\d/.test(p), special: /[^A-Za-z0-9]/.test(p), personal: p.length > 0 && personal
    };
    var all = true;
    rules.querySelectorAll('li').forEach(function (li) {
      var good = ok[li.dataset.rule];
      li.classList.toggle('ok', good); li.classList.toggle('bad', p.length > 0 && !good);
      if (!good) all = false;
    });
    pw.classList.toggle('is-invalid', p.length > 0 && !all);
    pw.classList.toggle('is-valid', all);
    if (cf.value) {
      var same = cf.value === p;
      match.textContent = same ? '✓ Passwords match' : '✗ Passwords do not match';
      match.className = 'pw-match ' + (same ? 'ok' : 'bad');
      cf.classList.toggle('is-invalid', !same); cf.classList.toggle('is-valid', same && all);
    } else { match.textContent = ''; cf.classList.remove('is-invalid', 'is-valid'); }
    return all && cf.value === p;
  }
  [pw, cf].forEach(function (i) { i.addEventListener('input', check); });
  ['name', 'cnic', 'email'].forEach(function (n) { if (form.elements[n]) form.elements[n].addEventListener('input', check); });
  document.querySelector('.pw-toggle').addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = cf.type = show ? 'text' : 'password';
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
  form.addEventListener('submit', function (e) {
    if (!check()) { e.preventDefault(); pw.focus(); rules.classList.add('shake');
      setTimeout(function () { rules.classList.remove('shake'); }, 400); }
  });
})();
</script>
